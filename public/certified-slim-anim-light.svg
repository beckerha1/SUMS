<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="70" viewBox="0 0 240 70" role="img">
  <title>Certified Independent Puzzler  puzzled.online</title>
  <style>
    text{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Noto Sans',sans-serif;font-weight:700}
  </style>

  <!-- Layout constants (by position): 7 tiles @ 20px with 4px gaps -->
  <!-- x positions: 38,62,86,110,134,158,182; y=12 -->
  <!-- Colors -->
  <defs>
    <g id="tile-green"><rect width="20" height="20" rx="6" fill="#22c55e"></rect></g>
    <g id="tile-blank"><rect width="20" height="20" rx="6" fill="#ffffff" stroke="#6d28d9"></rect></g>
  </defs>

  <!-- P -->
  <g transform="translate(38,12)">
    <use href="#tile-green"></use>
    <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">P</text>
  </g>

  <!-- U tile animates ? ” U -->
  <g transform="translate(62,12)">
    <!-- ? state -->
    <g id="uQ">
      <use href="#tile-blank"></use>
      <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">?</text>
    </g>
    <!-- U state -->
    <g id="uL" opacity="0">
      <use href="#tile-green"></use>
      <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">U</text>
    </g>
    <animate xlink:href="#uQ" attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"></animate>
    <animate xlink:href="#uL" attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"></animate>
  </g>

  <!-- Z -->
  <g transform="translate(86,12)">
    <use href="#tile-green"></use>
    <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">Z</text>
  </g>

  <!-- Z -->
  <g transform="translate(110,12)">
    <use href="#tile-green"></use>
    <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">Z</text>
  </g>

  <!-- L tile animates ? ” L (phase shifted) -->
  <g transform="translate(134,12)">
    <!-- ? state -->
    <g id="lQ">
      <use href="#tile-blank"></use>
      <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">?</text>
    </g>
    <!-- L state -->
    <g id="lL" opacity="0">
      <use href="#tile-green"></use>
      <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">L</text>
    </g>
    <animate xlink:href="#lQ" attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
    <animate xlink:href="#lL" attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3s" begin="1.5s" repeatCount="indefinite"></animate>
  </g>

  <!-- E -->
  <g transform="translate(158,12)">
    <use href="#tile-green"></use>
    <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">E</text>
  </g>

  <!-- D -->
  <g transform="translate(182,12)">
    <use href="#tile-green"></use>
    <text x="10" y="10.5" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#fff">D</text>
  </g>

  <!-- Small single line under logo -->
  <text x="120" y="58" font-size="10" text-anchor="middle" fill="#111827">Certified Independent Puzzler</text>
</svg>
